<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link rel="stylesheet" href="css/styles.css">

<body><a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header">
    <div class="container header-inner"><a class="brand" href="index.html">Tejidos <span>de Lana</span></a>
        <nav class="nav" aria-label="Principal"><a href="index.html">Inicio</a><a href="modelos.html">Modelos</a><a
                href="tienda.html">Tienda</a><a href="contacto.html" aria-current="page">Contacto</a><a
                href="blog.html">Blog</a></nav>
        <div class="session" data-session></div>
    </div>
</header>
<main id="contenido">
    <section class="section">
        <div class="container">
            <form id="contact-form" class="form-shell form-grid"><p class="eyebrow">Contacto</p>
                <h1>Escríbenos</h1>
                <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required></div>
                <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email"
                                                                           required></div>
                <div class="field"><label for="asunto">Asunto</label><input id="asunto" name="asunto" required></div>
                <div class="field"><label for="mensaje">Mensaje</label><textarea id="mensaje" name="mensaje" rows="7"
                                                                                 required></textarea></div>
                <div data-message aria-live="polite"></div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">Validar mensaje</button>
                    <button class="btn btn-secondary" type="reset">Limpiar</button>
                </div>
            </form>
        </div>
    </section>
</main>
<footer class="site-footer">

    </div>
</footer>

</body>
</html>
